name: "Defined Tests"

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: defined-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
            pull-requests: read
        env:
            # Hoisted to job level: the `secrets` context is not available in a
            # step-level `if`, but job-level env is visible to step conditions.
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  # Full history: SonarQube branch/PR analysis needs it.
                  fetch-depth: 0
                  # zizmor (artipacked): leave no credentials in .git/config.
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 26

            - name: Read tool pins
              id: pins
              shell: bash
              run: |
                  set -a
                  # shellcheck source=runtime/tool-versions.env
                  source runtime/tool-versions.env
                  set +a
                  {
                    echo "pinhash=$(sha256sum runtime/tool-versions.env | cut -c1-12)"
                    echo "node_tag=${NODE_IMAGE_TAG}"
                    echo "node_digest=${NODE_IMAGE_DIGEST}"
                  } >> "$GITHUB_OUTPUT"

            - name: Pre-pull published gate image
              shell: bash
              env:
                  # Passed via env, not interpolated into run:, so zizmor's
                  # template-injection audit stays quiet (it cannot tell a hash
                  # from attacker input).
                  PINHASH: ${{ steps.pins.outputs.pinhash }}
              run: |
                  set -euo pipefail
                  IMAGE="localhost/defined:${PINHASH}"
                  if docker image inspect "${IMAGE}" >/dev/null 2>&1; then
                    echo "image already present"
                    exit 0
                  fi
                  # Published on main merges; reuse it so PR runs skip the build.
                  # Only reuse it when the baked ENTRYPOINT matches the current
                  # source (comply.mts) — a stale entrypoint (pre-rebrand image)
                  # would exec a file that no longer exists under the bind-mount.
                  if docker pull "ghcr.io/markstanden/defined:${PINHASH}" 2>/dev/null; then
                    PUBLISHED="ghcr.io/markstanden/defined:${PINHASH}"
                    if docker image inspect --format '{{.Config.Entrypoint}}' "${PUBLISHED}" \
                        | grep -q 'comply.mts'; then
                      docker tag "${PUBLISHED}" "${IMAGE}"
                      echo "pulled published image with matching entrypoint"
                      exit 0
                    fi
                    echo "published image entrypoint is stale; comply.sh will build it"
                    exit 0
                  fi
                  echo "no published image; comply.sh will build it on first run"

            - name: Run test suite (unit + broken fixture)
              shell: bash
              run: node --test 'cli/*.test.mts' 'lib/*.test.mts' 'runtime/**/*.test.mts'

            - name: Run the gate on itself (bootstrap + repair + verify, with coverage)
              shell: bash
              run: ./runtime/comply.sh

            - name: SonarQube Cloud Scan
              # Inert until the SONAR_TOKEN secret is added — the gate has
              # already published coverage/lcov.info for the scanner to read.
              if: env.SONAR_TOKEN != ''
              uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
