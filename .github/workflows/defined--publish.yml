name: "Publish Defined Image"

on:
    # Every main push, deliberately unfiltered: `defined update latest` resolves
    # to the merge commit, so each main SHA must carry an image tag or the pin
    # it writes would be unusable. Unchanged layers dedupe, so re-pushing an
    # identical gate is cheap.
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: defined-publish
    cancel-in-progress: false

env:
    IMAGE_NAME: defined

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  # zizmor (artipacked): leave no credentials in .git/config.
                  persist-credentials: false

            - name: Compute tag hashes
              id: hashes
              shell: bash
              run: |
                  echo "pinhash=$(sha256sum runtime/tool-versions.env | cut -c1-12)" >> "$GITHUB_OUTPUT"
                  echo "shortsha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

            - name: Read tool pins
              id: pins
              shell: bash
              run: |
                  set -a
                  # shellcheck source=runtime/tool-versions.env
                  source runtime/tool-versions.env
                  set +a
                  echo "node_tag=${NODE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
                  echo "node_digest=${NODE_IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

            - name: Set up Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
              with:
                  context: .
                  file: runtime/Containerfile
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      NODE_IMAGE_TAG=${{ steps.pins.outputs.node_tag }}
                      NODE_IMAGE_DIGEST=${{ steps.pins.outputs.node_digest }}
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.hashes.outputs.pinhash }}
                      ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.hashes.outputs.shortsha }}
                      ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
