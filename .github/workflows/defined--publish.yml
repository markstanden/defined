name: "Publish Defined Image"

on:
    push:
        branches: [main]
        paths:
            - "runtime/**"
            - "lib/**"
            - "standards/**"
    workflow_dispatch:

concurrency:
    group: defined-publish
    cancel-in-progress: false

env:
    IMAGE_NAME: defined

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

            - name: Compute tag hashes
              id: hashes
              shell: bash
              run: |
                  echo "pinhash=$(sha256sum runtime/tool-versions.env | cut -c1-12)" >> "$GITHUB_OUTPUT"
                  echo "shortsha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

            - name: Read tool pins
              id: pins
              shell: bash
              run: |
                  set -a
                  # shellcheck source=runtime/tool-versions.env
                  source runtime/tool-versions.env
                  set +a
                  echo "node_tag=${NODE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
                  echo "node_digest=${NODE_IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

            - name: Set up Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
              with:
                  context: .
                  file: runtime/Containerfile
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      NODE_IMAGE_TAG=${{ steps.pins.outputs.node_tag }}
                      NODE_IMAGE_DIGEST=${{ steps.pins.outputs.node_digest }}
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.hashes.outputs.pinhash }}
                      ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.hashes.outputs.shortsha }}
                      ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
