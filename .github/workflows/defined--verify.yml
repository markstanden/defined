name: "Defined Gate"

# Reusable consumer template: run the defined gate against any repo.
# Consumer repos call this via a gitsha-pinned ref:
#
#   jobs:
#     quality:
#       uses: markstanden/defined/.github/workflows/defined--verify.yml@<shortsha>
#
# The image tag comes from the repo's committed .defined.json — the same pin
# the local `defined` launcher reads — so local green = merge green by
# construction. Release identity: an omitted `version` uses the current
# published default image; a written pin must be immutable (a hex SHA), and
# local green = merge green only while that pin matches the workflow ref (see
# PLAN.md). The pipeline verb is always read-only `verify`; `comply` is the
# local/agent loop, never CI.

on:
    workflow_call:

jobs:
    defined-gate:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  # zizmor (artipacked): leave no credentials in .git/config.
                  persist-credentials: false

            - name: Read image tag
              id: pin
              shell: bash
              run: |
                  set -euo pipefail
                  # Omitted version (or no file) = current published default.
                  if [[ -f .defined.json ]]; then
                    PIN="$(jq -r '.version // empty' .defined.json)"
                  else
                    PIN=""
                  fi
                  DEFAULTED="0"
                  if [[ -z "${PIN}" ]]; then
                    PIN="latest"
                    DEFAULTED="1"
                  fi
                  if [[ "${PIN}" == "latest" && "${DEFAULTED}" == "0" ]]; then
                    echo "::error::.defined.json must pin an immutable tag, not 'latest' — omit 'version' to default"
                    exit 1
                  fi
                  if [[ ! "${PIN}" =~ ^[0-9a-f]{7,40}$ ]]; then
                    echo "::error::.defined.json has an invalid pin '${PIN}' — expected a git SHA"
                    exit 1
                  fi
                  echo "pin=${PIN}" >> "$GITHUB_OUTPUT"

            - name: Run defined gate
              env:
                  IMAGE: ghcr.io/markstanden/defined:${{ steps.pin.outputs.pin }}
              shell: bash
              run: |
                  set -euo pipefail

                  REPO_ROOT="$(git -C "${GITHUB_WORKSPACE}" rev-parse --show-toplevel)"

                  docker run --rm \
                    --user "$(id -u):$(id -g)" \
                    -v "${REPO_ROOT}:/repo:ro" \
                    -e "NUGET_PACKAGES=/home/node/.nuget/packages" \
                    --workdir /repo \
                    "${IMAGE}" verify
