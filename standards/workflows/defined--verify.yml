name: "Defined Gate"

# Managed gate workflow: installed by `comply` into .github/workflows/ and
# checked byte-identical by `verify` (standards/workflows/ is the single source
# of truth). It carries no gate version — the image tag is read at runtime from
# the repo's committed .defined.json, the same pin the local `defined` launcher
# reads — so local green = merge green by construction, with no SHA to keep in
# sync (decision #36).
#
# An omitted `version` (or no .defined.json) rides the current published default
# image; a written pin must be an immutable tag, never "latest". The verb is
# always read-only `verify`: `comply` is the local/agent loop, never CI.
#
# Triggers are owned here, not by a caller, so they are name-agnostic: gate every
# pull request and every push, on any branch name.

on:
    pull_request:
    push:

concurrency:
    group: defined-gate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    defined-gate:
        runs-on: ubuntu-latest
        # The gate's own source repo tests from source (defined--test.yml). The
        # published image there would compare its baked standards against the
        # working tree, so any PR touching a managed file would false-fail on
        # drift until release — skip it.
        if: github.repository != 'markstanden/defined'
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  # zizmor (artipacked): leave no credentials in .git/config.
                  persist-credentials: false

            - name: Read image tag
              id: pin
              shell: bash
              run: |
                  set -euo pipefail
                  # Omitted version (or no file) = current published default.
                  if [[ -f .defined.json ]]; then
                    PIN="$(jq -r '.version // empty' .defined.json)"
                  else
                    PIN=""
                  fi
                  if [[ -z "${PIN}" ]]; then
                    echo "pin=latest" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [[ "${PIN}" == "latest" ]]; then
                    echo "::error::.defined.json must pin an immutable tag, not 'latest' — omit 'version' to default"
                    exit 1
                  fi
                  if [[ ! "${PIN}" =~ ^[0-9a-f]{7,40}$ ]]; then
                    echo "::error::.defined.json has an invalid pin '${PIN}' — expected a hex tag"
                    exit 1
                  fi
                  echo "pin=${PIN}" >> "$GITHUB_OUTPUT"

            - name: Run defined gate
              env:
                  IMAGE: ghcr.io/markstanden/defined:${{ steps.pin.outputs.pin }}
              shell: bash
              run: |
                  set -euo pipefail

                  REPO_ROOT="$(git -C "${GITHUB_WORKSPACE}" rev-parse --show-toplevel)"

                  docker run --rm \
                    --user "$(id -u):$(id -g)" \
                    -v "${REPO_ROOT}:/repo:ro" \
                    -e "NUGET_PACKAGES=/home/node/.nuget/packages" \
                    --workdir /repo \
                    "${IMAGE}" verify
